name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install mcp websockets ruff

      - name: Syntax check
        run: python -m py_compile cubism_mcp.py

      - name: Import check
        run: python -c "import cubism_mcp"

      - name: Lint (ruff)
        run: ruff check cubism_mcp.py --ignore=E501
